<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIMO ISA Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; color: #333; }
        h1 { color: #0056b3; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; font-family: monospace; padding: 10px; margin-bottom: 10px; }
        button { background: #0056b3; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #004080; }
        pre { background: #eee; padding: 10px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h1>LIMO Architecture Simulator (Milestone 2)</h1>
    
    <div class="container">
        <!-- Assembly Input Panel -->
        <div class="panel">
            <h3>Assembly Input</h3>
            <textarea id="assemblyCode" placeholder="Enter LIMO assembly here... (e.g., eketsa_e r3, r0, 5)">eketsa_e r3, r0, 5</textarea>
            <br>
            <button onclick="runAssembler()">Assemble Code</button>
        </div>

        <!-- Machine Code Output Panel -->
        <div class="panel">
            <h3>Machine Code / Status Output</h3>
            <pre id="outputResult">Output will appear here...</pre>
        </div>
    </div>

    <script>
        class LimoAssembler {
            constructor() {
                this.opcodes = {
                    'eketsa':   { type: 'R', opcode: 0x01 },
                    'eketsa_e': { type: 'I', opcode: 0x02 },
                    'boloka':   { type: 'S', opcode: 0x03 },
                    'jarolla':  { type: 'L', opcode: 0x04 },
                    'fapana':   { type: 'B', opcode: 0x05 }
                };
            }

            parseRegister(regStr, lineNum) {
                const cleanReg = regStr.trim().toLowerCase();
                const match = cleanReg.match(/^r([0-9]|1[0-5])$/);
                if (!match) {
                    throw new Error(`Line ${lineNum}: Invalid register '${regStr}'. Must be r0 through r15.`);
                }
                return parseInt(match[1], 10);
            }

            parseImmediate(immStr, lineNum) {
                let val;
                const cleanImm = immStr.trim();
                if (cleanImm.startsWith('0x') || cleanImm.startsWith('0X')) {
                    val = parseInt(cleanImm, 16);
                } else {
                    val = parseInt(cleanImm, 10);
                }
                if (isNaN(val)) {
                    throw new Error(`Line ${lineNum}: Invalid immediate value '${immStr}'.`);
                }
                return val;
            }

            assemble(sourceCode) {
                const lines = sourceCode.split('\n');
                const symbolTable = {};
                const instructionsToProcess = [];
                const errors = [];
                let currentAddress = 0;

                for (let i = 0; i < lines.length; i++) {
                    const lineNum = i + 1;
                    let rawLine = lines[i].split('#')[0].trim();
                    if (!rawLine) continue;

                    if (rawLine.includes(':')) {
                        const parts = rawLine.split(':');
                        const labelName = parts[0].trim();
                        if (symbolTable[labelName] !== undefined) {
                          errors.push({ line: lineNum, message: `Duplicate label definition: '${labelName}'` });
                        }
                        symbolTable[labelName] = currentAddress;
                        rawLine = parts[1].trim();
                        if (!rawLine) continue;
                    }

                    instructionsToProcess.push({ lineNum, address: currentAddress, text: rawLine });
                    currentAddress += 4;
                }

                if (errors.length > 0) {
                    return { success: false, errors, machineCode: [] };
                }

                const machineCode = [];
                for (const item of instructionsToProcess) {
                    try {
                        const { lineNum, address, text } = item;
                        const tokens = text.replace(/,/g, ' ').split(/\s+/).filter(Boolean);
                        const mnemonic = tokens[0].toLowerCase();

                        if (!this.opcodes[mnemonic]) {
                            throw new Error(`Line ${lineNum}: Unknown instruction mnemonic '${mnemonic}'.`);
                        }

                        const spec = this.opcodes[mnemonic];
                        let encodedHex = '';

                        if (spec.type === 'I') {
                            const rd = this.parseRegister(tokens[1], lineNum);
                            const rs = this.parseRegister(tokens[2], lineNum);
                            const imm = this.parseImmediate(tokens[3], lineNum);
                            const imm16 = imm & 0xFFFF;
                            const machineWord = (spec.opcode << 24) | (rd << 20) | (rs << 16) | imm16;
                            encodedHex = '0x' + machineWord.toString(16).padStart(8, '0');
                        } else if (spec.type === 'R') {
                            const rd = this.parseRegister(tokens[1], lineNum);
                            const rs1 = this.parseRegister(tokens[2], lineNum);
                            const rs2 = this.parseRegister(tokens[3], lineNum);
                            const machineWord = (spec.opcode << 24) | (rd << 20) | (rs1 << 16) | (rs2 << 12);
                            encodedHex = '0x' + machineWord.toString(16).padStart(8, '0');
                        } else if (spec.type === 'S' || spec.type === 'L') {
                            const rt = this.parseRegister(tokens[1], lineNum);
                            const memTarget = tokens[2];
                            const memMatch = memTarget.match(/^(-?\d+)\((r[0-9]|1[0-5])\)$/);
                            if (!memMatch) {
                                throw new Error(`Line ${lineNum}: Invalid memory syntax '${memTarget}'. Expected offset(base).`);
                            }
                            const offset = parseInt(memMatch[1], 10);
                            const base = this.parseRegister(memMatch[2], lineNum);
                            const machineWord = (spec.opcode << 24) | (rt << 20) | (base << 16) | (offset & 0xFFFF);
                            encodedHex = '0x' + machineWord.toString(16).padStart(8, '0');
                        } else if (spec.type === 'B') {
                            const rs1 = this.parseRegister(tokens[1], lineNum);
                            const rs2 = this.parseRegister(tokens[2], lineNum);
                            let targetVal;
                            const targetStr = tokens[3];
                            if (symbolTable[targetStr] !== undefined) {
                                targetVal = (symbolTable[targetStr] - (address + 4)) / 4;
                            } else {
                                targetVal = this.parseImmediate(targetStr, lineNum);
                            }
                            const machineWord = (spec.opcode << 24) | (rs1 << 20) | (rs2 << 16) | (targetVal & 0xFFFF);
                            encodedHex = '0x' + machineWord.toString(16).padStart(8, '0');
                        }

                        machineCode.push({
                            address: '0x' + address.toString(16).padStart(4, '0'),
                            hex: encodedHex,
                            source: text
                        });

                    } catch (err) {
                        errors.push({ line: item.lineNum, message: err.message });
                    }
                }

                if (errors.length > 0) {
                    return { success: false, errors, machineCode: [] };
                }

                return { success: true, errors: [], machineCode };
            }
        }

        function runAssembler() {
            const code = document.getElementById('assemblyCode').value;
            const outputBox = document.getElementById('outputResult');
            
            try {
                const assembler = new LimoAssembler();
                const result = assembler.assemble(code);
                outputBox.textContent = JSON.stringify(result, null, 2);
            } catch (err) {
                outputBox.textContent = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>


<!-- M3 Simulator Dashboard UI Component -->
<div id="limo-debugger" class="dashboard-container">
    <!-- Simulation Control Toolbar -->
    <div class="toolbar">
        <button id="btn-run" class="btn primary">Run</button>
        <button id="btn-pause" class="btn">Pause</button>
        <button id="btn-step" class="btn">Step (1 Cycle)</button>
        <button id="btn-reset" class="btn danger">Reset</button>
        <span class="metrics-display">Cycles: <strong id="val-cycles">0</strong> | Instructions: <strong id="val-inst">0</strong> | CPI: <strong id="val-cpi">0.00</strong></span>
    </div>

    <div class="dashboard-grid">
        <!-- Pipeline Stage Inspector -->
        <div class="panel">
            <h3>Pipeline Stages</h3>
            <ul class="pipeline-stages">
                <li><strong>IF:</strong> <span id="pipe-if">--</span></li>
                <li><strong>ID:</strong> <span id="pipe-id">--</span></li>
                <li><strong>EX:</strong> <span id="pipe-ex">--</span></li>
                <li><strong>MEM:</strong> <span id="pipe-mem">--</span></li>
                <li><strong>WB:</strong> <span id="pipe-wb">--</span></li>
            </ul>
        </div>

        <!-- Register File Viewer (r0 - r15) -->
        <div class="panel">
            <h3>Register File</h3>
            <div id="register-grid" class="reg-grid">
                <!-- Populated dynamically via JS -->
            </div>
        </div>
    </div>
</div>
